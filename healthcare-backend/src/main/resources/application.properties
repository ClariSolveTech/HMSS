# ── JWT ──────────────────────────────────────────────────────────────────────
# IMPORTANT: Replace this secret with a secure random value in production!
jwt.secret=N2Y0N2M5NTJlYWZhMjllYjczZDRmM2Q4NzM4YjBhYTA=
jwt.expiration=86400000

server.port=8081

# ── AI Provider Configuration ────────────────────────────────────────────────
# Choices: mock | gemini | cohere
ai.provider=mock
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-1.5-flash
ai.cohere.api-key=${COHERE_API_KEY:}
ai.cohere.model=command-r-plus-08-2024

